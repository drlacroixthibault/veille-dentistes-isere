name: Mise à jour quotidienne

on:
  schedule:
    - cron: "23 5 * * *"   # chaque matin vers 6 h 20 (heure de Paris en hiver)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire l'annuaire et comparer
        run: python veille.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "Mise à jour du $(date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publier la page
        uses: actions/deploy-pages@v4

      - name: Alerte e-mail s'il y a du nouveau
        if: hashFiles('nouveaux_mouvements.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(cat nouveaux_mouvements.md.titre) — $(date +%d/%m/%Y)" \
            --body-file nouveaux_mouvements.md \
            --assignee "${{ github.repository_owner }}"
